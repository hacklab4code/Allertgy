# Sostituisci api.allertgy.it e app.allertgy.it con i tuoi domini reali.
# Prima del certificato SSL, usa solo la sezione server :80.

upstream allertgy_api {
    server api:8000;
}

server {
    listen 80;
    server_name api.allertgy.it;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.allertgy.it;

    ssl_certificate /etc/letsencrypt/live/api.allertgy.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.allertgy.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12M;

    location / {
        proxy_pass http://allertgy_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
